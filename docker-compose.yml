services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: oneweb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: KJFiMFjI9FCUtlBn5xYaKqrkIblP
      POSTGRES_DB: oneweb
    # Bound to loopback — never expose the database to the internet.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: oneweb_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:

# Production stack. Bring up with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Every secret comes from .env.prod (git-ignored). Postgres and Redis are bound
# to loopback only — publishing them to 0.0.0.0 with a default password is
# exactly how this project was compromised on 2026-08-05.
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: oneweb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oneweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-oneweb}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oneweb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oneweb_redis
    restart: unless-stopped
    # requirepass keeps it safe even if the port is ever exposed by accident.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/OneWeb.Api/Dockerfile
    container_name: oneweb_api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [.env.prod]
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-oneweb};Username=${POSTGRES_USER:-oneweb};Password=${POSTGRES_PASSWORD}"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:5102:5102"

  web:
    build:
      context: ./website
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: oneweb_web
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
